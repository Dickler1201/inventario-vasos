<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario y Ventas - Vasos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-glass-water"></i> Control de Vasos
            </h1>
            
            <!-- Tasa BCV -->
            <div class="flex items-center gap-2 bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">
                <span class="text-sm text-slate-300">Tasa BCV:</span>
                <span id="labelTasa" class="font-bold text-emerald-400">36.50</span> <span class="text-xs text-slate-400">Bs/$</span>
                <button onclick="editarTasa()" class="text-slate-400 hover:text-white ml-2">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full space-y-6">

        <!-- Resumen del Día -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-md">
                <p class="text-sm text-slate-400">Ventas Totales (USD)</p>
                <h2 id="totalVentasUSD" class="text-2xl font-bold text-emerald-400">$0.00</h2>
                <p id="totalVentasBS" class="text-xs text-slate-400 mt-1">Bs. 0.00</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-md">
                <p class="text-sm text-slate-400">Vasos Gastados (Hoy)</p>
                <h2 id="totalVasosGastados" class="text-2xl font-bold text-amber-400">0 unids.</h2>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-md flex flex-col justify-between">
                <p class="text-sm text-slate-400">Acciones de Jornada</p>
                <button onclick="cerrarJornada()" class="mt-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/50 py-1.5 px-3 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Reiniciar / Cerrar Día
                </button>
            </div>
        </section>

        <!-- Inventario y Registro -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl shadow-md overflow-hidden">
            <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-200">Gestión de Inventario y Ventas</h3>
                <button onclick="ajustarInventario()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300">
                    <i class="fa-solid fa-boxes-stacked mr-1"></i> Cargar Stock Inicial
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase bg-slate-900/40">
                            <th class="p-3">Tipo de Vaso</th>
                            <th class="p-3 text-center">Precio Unit.</th>
                            <th class="p-3 text-center">Stock Disponible</th>
                            <th class="p-3 text-center">Usados Hoy</th>
                            <th class="p-3 text-right">Acción de Venta</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVasos" class="divide-y divide-slate-700 text-sm">
                        <!-- Generado por JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Footer Status -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Sincronizado en tiempo real con Firebase • Control de Inventario
    </footer>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUrgN2EZmT3EYlvp7j7GEvto1WoYWW0oQ",
            authDomain: "inventariovasos-5da29.firebaseapp.com",
            projectId: "inventariovasos-5da29",
            storageBucket: "inventariovasos-5da29.firebasestorage.app",
            messagingSenderId: "752789375926",
            appId: "1:752789375926:web:787bd91263fee1e4010f17"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Estructura inicial de datos
        let datosApp = {
            tasa: 36.50,
            inventario: {
                pequeno: { nombre: "Pequeños (8onz)", precio: 1.75, stock: 100, usados: 0 },
                mediano: { nombre: "Medianos (12onz)", precio: 2.50, stock: 100, usados: 0 },
                grande: { nombre: "Grandes (16onz)", precio: 3.90, stock: 100, usados: 0 },
                extragrande: { nombre: "Extra grandes (22onz)", precio: 5.50, promoPrecio: 10.00, promoCantidad: 2, stock: 100, usados: 0 },
                tina: { nombre: "Tinas (32onz)", precio: 6.90, promoPrecio: 12.00, promoCantidad: 2, stock: 100, usados: 0 }
            }
        };

        const docRef = doc(db, "control", "estadoActual");

        // Escuchar cambios en tiempo real desde Firebase
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                datosApp = docSnap.data();
            } else {
                guardarEnFirebase();
            }
            renderizarApp();
        });

        async function guardarEnFirebase() {
            try {
                await setDoc(docRef, datosApp);
            } catch (e) {
                console.error("Error al guardar en Firebase: ", e);
            }
        }

        window.renderizarApp = function() {
            document.getElementById("labelTasa").innerText = Number(datosApp.tasa).toFixed(2);
            
            let tbody = document.getElementById("tablaVasos");
            tbody.innerHTML = "";

            let totalUSD = 0;
            let totalVasos = 0;

            for (let key in datosApp.inventario) {
                let item = datosApp.inventario[key];
                
                // Calcular ventas totales basadas en los vasos usados (aproximado o registro directo)
                // Aquí calculamos ingreso estimado por los usados
                totalUSD += (item.usados || 0) * item.precio;
                totalVasos += (item.usados || 0);

                let promoHtml = "";
                if (item.promoPrecio) {
                    promoHtml = `<br><button onclick="venderPromo('${key}')" class="mt-1 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/40 text-xs px-2 py-0.5 rounded transition">
                        Promo 2x$${item.promoPrecio}
                    </button>`;
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/20">
                        <td class="p-3 font-medium text-slate-200">
                            ${item.nombre}
                            <div class="text-xs text-slate-400">$${item.precio.toFixed(2)} c/u ${promoHtml}</div>
                        </td>
                        <td class="p-3 text-center text-slate-300">$${item.precio.toFixed(2)}</td>
                        <td class="p-3 text-center font-bold text-blue-400">${item.stock}</td>
                        <td class="p-3 text-center font-bold text-amber-400">${item.usados || 0}</td>
                        <td class="p-3 text-right space-x-1">
                            <button onclick="registrarVenta('${key}', 1)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs font-bold transition">
                                +1 Venta
                            </button>
                            <button onclick="registrarVenta('${key}', -1)" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1 rounded text-xs transition" title="Restar">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }

            document.getElementById("totalVentasUSD").innerText = `$${totalUSD.toFixed(2)}`;
            document.getElementById("totalVentasBS5")?.remove(); // limpieza si aplica
            let totalBs = totalUSD * datosApp.tasa;
            document.getElementById("totalVentasBS").innerText = `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById("totalVasosGastados").innerText = `${totalVasos} unids.`;
        }

        window.registrarVenta = async function(key, cantidad) {
            let item = datosApp.inventario[key];
            if (cantidad > 0 && item.stock < cantidad) {
                alert("No hay suficiente stock disponible.");
                return;
            }
            item.stock -= cantidad;
            item.usados = (item.usados || 0) + cantidad;
            if (item.usados < 0) item.usados = 0;
            if (item.stock < 0) item.stock = 0;

            await guardarEnFirebase();
        }

        window.venderPromo = async function(key) {
            let item = datosApp.inventario[key];
            if (item.stock < 2) {
                alert("No hay suficiente stock para la promoción (requiere 2).");
                return;
            }
            item.stock -= 2;
            item.usados = (item.usados || 0) + 2;

            // Nota: Para llevar el dinero exacto de promos se podría expandir, por simplicidad suma al stock usado
            await guardarEnFirebase();
        }

        window.editarTasa = async function() {
            let nuevaTasa = prompt("Ingrese la tasa actual del BCV (Bs/$):", datosApp.tasa);
            if (nuevaTasa !== null && !isNaN(nuevaTasa) && Number(nuevaTasa) > 0) {
                datosApp.tasa = Number(nuevaTasa);
                await guardarEnFirebase();
            }
        }

        window.ajustarInventario = async function() {
            let tipo = prompt("¿Qué vaso deseas ajustar?\n(pequeno, mediano, grande, extragrande, tina)");
            if (!tipo || !datosApp.inventario[tipo.toLowerCase()]) {
                if (tipo) alert("Tipo de vaso no válido.");
                return;
            }
            let nuevoStock = prompt(`Ingrese el nuevo stock para ${datosApp.inventario[tipo.toLowerCase()].nombre}:`, datosApp.inventario[tipo.toLowerCase()].stock);
            if (nuevoStock !== null && !isNaN(nuevoStock)) {
                datosApp.inventario[tipo.toLowerCase()].stock = parseInt(nuevoStock);
                await guardarEnFirebase();
            }
        }

        window.cerrarJornada = async function() {
            if (confirm("¿Estás seguro de reiniciar el conteo diario? El stock actual se mantendrá pero los 'Usados hoy' volverán a 0.")) {
                for (let key in datosApp.inventario) {
                    datosApp.inventario[key].usados = 0;
                }
                await guardarEnFirebase();
            }
        }
    </script>
</body>
</html>
